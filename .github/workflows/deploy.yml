name: Deploy Men With a Van

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: menwithvan-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy website and quote backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate backend syntax
        run: python3 -m py_compile outputs/menwithvan-backend/app.py

      - name: Build deployment package
        run: |
          set -euo pipefail
          mkdir -p package/backend package/html
          cp outputs/menwithvan-backend/app.py package/backend/app.py
          cp -a outputs/menwithvan-demo/. package/html/
          tar -C package -czf menwithvan-deploy.tgz backend html

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/menwithvan_deploy_key
          chmod 600 ~/.ssh/menwithvan_deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/menwithvan_deploy_key "$VPS_USER@$VPS_HOST" 'whoami'

      - name: Upload package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote_package="$(ssh -o StrictHostKeyChecking=yes -i ~/.ssh/menwithvan_deploy_key "$VPS_USER@$VPS_HOST" 'mktemp /tmp/menwithvan-deploy.XXXXXX.tgz')"
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/menwithvan_deploy_key "$VPS_USER@$VPS_HOST" "cat > '$remote_package'" < menwithvan-deploy.tgz
          printf '%s\n' "$remote_package" > remote-package-path.txt

      - name: Install on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote_package="$(cat remote-package-path.txt)"
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/menwithvan_deploy_key "$VPS_USER@$VPS_HOST" "sudo -n /usr/local/sbin/menwithvan-deploy-from-tar '$remote_package'; rm -f '$remote_package'"
